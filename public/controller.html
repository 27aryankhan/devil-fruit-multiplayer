<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dojo Blade - Controller</title>
  <link rel="stylesheet" href="css/controller.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <!-- Fullscreen Touch Active Pad -->
  <div id="touch-pad"></div>

  <!-- Setup Fullscreen Overlay (Enter Screen) -->
  <div id="overlay-setup" class="fullscreen-overlay">
    <div class="overlay-card">
      <div class="logo-wrap">
        <h1 class="title">DOJO BLADE</h1>
        <p class="subtitle">Real-time Sword Controller</p>
      </div>
      
      <!-- Connection Status Badge -->
      <div class="status-msg" id="status-text">
        <span class="status-indicator-dot" id="status-dot"></span>
        <span id="status-label">Connecting to Dojo Server...</span>
      </div>
      
      <!-- Form for Name & Flag -->
      <form id="setup-form" onsubmit="event.preventDefault(); requestJoin();" style="display: flex; flex-direction: column; gap: 14px; width: 100%;">
        <!-- Name Entry Field -->
        <div class="name-entry-container" style="display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%;">
          <label for="name-input" class="field-label">Slayer Name</label>
          <input type="text" id="name-input" placeholder="Connecting..." maxlength="14" 
                 autocomplete="nickname" autocapitalize="words" enterkeyhint="go"
                 class="form-input" />
        </div>

        <!-- Nationality / Flag Selector -->
        <div class="country-entry-container" style="display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%;">
          <label for="country-select" class="field-label">Nationality Flag</label>
          <select id="country-select" class="form-select">
            <optgroup label="🌏 Asia & Pacific">
              <option value="IN">🇮🇳 India</option>
              <option value="JP">🇯🇵 Japan</option>
              <option value="CN">🇨🇳 China</option>
              <option value="KR">🇰🇷 South Korea</option>
              <option value="SG">🇸🇬 Singapore</option>
              <option value="ID">🇮🇩 Indonesia</option>
              <option value="PK">🇵🇰 Pakistan</option>
              <option value="BD">🇧🇩 Bangladesh</option>
              <option value="VN">🇻🇳 Vietnam</option>
              <option value="PH">🇵🇭 Philippines</option>
              <option value="TH">🇹🇭 Thailand</option>
              <option value="MY">🇲🇾 Malaysia</option>
              <option value="AU">🇦🇺 Australia</option>
              <option value="NZ">🇳🇿 New Zealand</option>
              <option value="LK">🇱🇰 Sri Lanka</option>
              <option value="NP">🇳🇵 Nepal</option>
              <option value="HK">🇭🇰 Hong Kong</option>
              <option value="TW">🇹🇼 Taiwan</option>
            </optgroup>
            <optgroup label="🌍 Europe">
              <option value="GB">🇬🇧 United Kingdom</option>
              <option value="DE">🇩🇪 Germany</option>
              <option value="FR">🇫🇷 France</option>
              <option value="IT">🇮🇹 Italy</option>
              <option value="ES">🇪🇸 Spain</option>
              <option value="NL">🇳🇱 Netherlands</option>
              <option value="CH">🇨🇭 Switzerland</option>
              <option value="SE">🇸🇪 Sweden</option>
              <option value="NO">🇳🇴 Norway</option>
              <option value="DK">🇩🇰 Denmark</option>
              <option value="FI">🇫🇮 Finland</option>
              <option value="PL">🇵🇱 Poland</option>
              <option value="AT">🇦🇹 Austria</option>
              <option value="BE">🇧🇪 Belgium</option>
              <option value="IE">🇮🇪 Ireland</option>
              <option value="PT">🇵🇹 Portugal</option>
              <option value="GR">🇬🇷 Greece</option>
              <option value="TR">🇹🇷 Turkey</option>
              <option value="UA">🇺🇦 Ukraine</option>
              <option value="RU">🇷🇺 Russia</option>
              <option value="CZ">🇨🇿 Czech Republic</option>
              <option value="RO">🇷🇴 Romania</option>
            </optgroup>
            <optgroup label="🌎 Americas">
              <option value="US">🇺🇸 United States</option>
              <option value="CA">🇨🇦 Canada</option>
              <option value="BR">🇧🇷 Brazil</option>
              <option value="MX">🇲🇽 Mexico</option>
              <option value="AR">🇦🇷 Argentina</option>
              <option value="CL">🇨🇱 Chile</option>
              <option value="CO">🇨🇴 Colombia</option>
              <option value="PE">🇵🇪 Peru</option>
              <option value="VE">🇻🇪 Venezuela</option>
              <option value="EC">🇪🇨 Ecuador</option>
              <option value="CR">🇨🇷 Costa Rica</option>
              <option value="PA">🇵🇦 Panama</option>
              <option value="UY">🇺🇾 Uruguay</option>
            </optgroup>
            <optgroup label="🌍 Middle East & Africa">
              <option value="AE">🇦🇪 United Arab Emirates</option>
              <option value="SA">🇸🇦 Saudi Arabia</option>
              <option value="QA">🇶🇦 Qatar</option>
              <option value="KW">🇰🇼 Kuwait</option>
              <option value="OM">🇴🇲 Oman</option>
              <option value="BH">🇧🇭 Bahrain</option>
              <option value="IL">🇮🇱 Israel</option>
              <option value="EG">🇪🇬 Egypt</option>
              <option value="NG">🇳🇬 Nigeria</option>
              <option value="ZA">🇿🇦 South Africa</option>
              <option value="KE">🇰🇪 Kenya</option>
              <option value="MA">🇲🇦 Morocco</option>
              <option value="GH">🇬🇭 Ghana</option>
              <option value="DZ">🇩🇿 Algeria</option>
            </optgroup>
          </select>
        </div>
        
        <!-- Enter Button -->
        <button type="submit" class="action-btn enter-btn" id="btn-join" disabled>
          ⚔️ ENTER GAME
        </button>
      </form>
    </div>
  </div>

  <!-- Connected Controller HUD Overlay -->
  <div id="hud-container" class="hidden">
    <div class="hud-top">
      <div class="player-badge" id="player-badge">
        <span class="badge-dot" id="badge-dot"></span>
        <span id="player-name">Player X</span>
        <span id="player-flag" style="font-size: 1rem; margin-left: 2px;"></span>
      </div>
      <div class="mode-tag" id="hud-mode">Classic</div>
    </div>

    <!-- Centered Score / Timer -->
    <div class="hud-center">
      <div class="score-display">
        <span class="label">SCORE</span>
        <span class="value" id="hud-score">0</span>
      </div>
      <div class="timer-display hidden" id="hud-timer">90s</div>
    </div>

    <div class="hud-bottom">
      <!-- Lives Display (Classic) -->
      <div class="lives-display" id="hud-lives">
        <span class="heart-icon" id="heart-1">❤️</span>
        <span class="heart-icon" id="heart-2">❤️</span>
        <span class="heart-icon" id="heart-3">❤️</span>
      </div>
      
      <!-- Controller Status text -->
      <div class="swipe-hint" id="swipe-hint">🗡️ Swipe anywhere on screen to slash!</div>
    </div>
  </div>

  <!-- Game Over mobile overlay -->
  <div id="game-over-overlay" class="fullscreen-overlay hidden">
    <div class="overlay-card">
      <h2 class="title" style="color: #ff3366;">MATCH ENDED</h2>
      <p class="subtitle">Check the main screen for rankings</p>
      
      <div class="final-score">
        <span>Your Score:</span>
        <span id="final-score-val" class="final-val">0</span>
      </div>

      <button class="action-btn restart-btn" id="btn-play-again" onclick="requestPlayAgain()">
        ⚔️ Play Again
      </button>
    </div>
  </div>

  <!-- Load script -->
  <script src="js/controller.js"></script>
</body>
</html>
